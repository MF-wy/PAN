<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Share 🐾 寵物交流平台 - 登入</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="light-mode">

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <!-- Logo -->
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">🐾</span>
        <span class="logo-text">Pet Share</span>
      </a>

      <!-- Desktop Nav Links -->
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="nav-link" id="nav-home"><i class="fa-solid fa-house"></i> 首頁</a></li>
        <li><a href="feed.html" class="nav-link" id="nav-feed"><i class="fa-solid fa-paw"></i> 分享區</a></li>
        <li><a href="create.html" class="nav-link" id="nav-create"><i class="fa-solid fa-plus-circle"></i> 新增貼文</a></li>
        <li id="navProfileLink" style="display:none"><a href="profile.html" class="nav-link" id="nav-profile"><i class="fa-solid fa-user"></i> 個人頁</a></li>
      </ul>

      <!-- Right side: theme toggle + auth -->
      <div class="nav-right">
        <!-- Dark mode toggle -->
        <button class="theme-toggle" id="themeToggle" title="切換深色模式">
          <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>

        <!-- Auth area (guest) -->
        <div id="guestNav">
          <a href="login.html" class="btn btn-outline"><i class="fa-solid fa-right-to-bracket"></i> 登入</a>
        </div>

        <!-- Auth area (logged in) -->
        <div id="userNav" style="display:none" class="user-nav">
          <div class="nav-avatar-wrap" id="navAvatarWrap">
            <img src="" alt="avatar" class="nav-avatar" id="navAvatar" />
            <span id="navUsername" class="nav-username"></span>
          </div>
          <button class="btn btn-outline btn-sm" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> 登出</button>
        </div>
      </div>

      <!-- Hamburger -->
      <button class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ========== PAGES WRAPPER ========== -->
  <main class="main-content">

    <!-- ===== PAGE: LOGIN / REGISTER ===== -->
    <section class="page active" id="page-login">
      <div class="auth-container">
        <!-- Tabs -->
        <div class="auth-tabs">
          <a href="login.html" class="auth-tab active" id="loginTab">登入</a>
          <a href="register.html" class="auth-tab" id="registerTab">註冊</a>
        </div>

        <!-- LOGIN FORM -->
        <div class="auth-form" id="loginForm">
          <div class="auth-logo">🐾</div>
          <h2>歡迎回來！</h2>
          <p class="auth-sub">登入後與毛孩朋友交流</p>

          <div class="form-group">
            <label><i class="fa-solid fa-id-card"></i> 使用者 ID</label>
            <input type="text" id="loginId" placeholder="輸入你的 ID" />
          </div>
          <div class="form-group">
            <label><i class="fa-solid fa-lock"></i> 密碼</label>
            <div class="pw-wrap">
              <input type="password" id="loginPw" placeholder="輸入密碼" />
              <button type="button" class="pw-toggle" onclick="Auth.togglePw('loginPw', this)"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="form-msg error" id="loginError" style="display:none"></div>
          <button class="btn btn-primary btn-full" id="loginSubmitBtn">
            <i class="fa-solid fa-right-to-bracket"></i> 登入
          </button>
          <p class="switch-auth">還沒有帳號？<a href="register.html">立即註冊</a></p>
        </div>
      </div>
    </section>

  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- ========== SCRIPTS ========== -->
  <script src="storage.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 解析註冊後自動帶入 ID 的參數
      const params = new URLSearchParams(window.location.search);
      const regId = params.get('regId');
      if (regId) {
        const idInput = document.getElementById('loginId');
        if (idInput) {
          idInput.value = regId;
          const pwInput = document.getElementById('loginPw');
          if (pwInput) pwInput.focus();
        }
      }

      // 綁定登入按鈕
      const loginBtn = document.getElementById('loginSubmitBtn');
      if (loginBtn) {
        loginBtn.addEventListener('click', Auth.login);
      }

      // Enter 鍵觸發登入
      document.getElementById('loginPw')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') Auth.login();
      });
      document.getElementById('loginId')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') Auth.login();
      });
    });
  </script>
</body>
</html>
